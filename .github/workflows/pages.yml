# Публикация админ-панели на GitHub Pages: https://wtfhoshi.github.io/tkpst-admin/
# Публикуется только папка public/. Если тесты упали — на сайт ничего не уходит.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        run: node --experimental-strip-types --test test/*.test.mjs
      - name: Версия файлов (чтобы браузер сразу брал новые)
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" public/*.html public/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
